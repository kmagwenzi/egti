# ==============================================================================
# EGTI - Local Development Configuration
# ==============================================================================
# Profile: dev
# Purpose: Local testing without DataSourceConfig interference
# ==============================================================================

# ━━━ SERVER CONFIGURATION ━━━
server.port=8080

# ━━━ DATABASE CONFIGURATION (PostgreSQL) ━━━
# Direct JDBC URL configuration (bypasses DataSourceConfig parsing)
spring.datasource.url=jdbc:postgresql://localhost:5432/egti
spring.datasource.username=egti_user
spring.datasource.password=PidDRn1YyFNI3Q9RSteIpe5GAiu3uVtz
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Development)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ━━━ JPA/HIBERNATE CONFIGURATION ━━━
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ━━━ SECURITY CONFIGURATION ━━━
spring.security.user.name=bishop
spring.security.user.password=4edfb54ae20fa3c5991463aa106f7e5e

# ━━━ APPLICATION SETTINGS ━━━
spring.application.name=EGTI (Dev)

# ━━━ THYMELEAF CONFIGURATION ━━━
# Development: cache DISABLED for live reload
spring.thymeleaf.cache=false

# ━━━ LOGGING ━━━
# Development: More verbose logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.zw.co.egti=DEBUG

# ━━━ DEVTOOLS ━━━
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true